<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise Income Tracker</title>
    <!-- Bootstrap 5 CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light py-5">
    <main class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <!-- Registration Card -->
          <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-primary text-white py-3">
              <h1 class="h5 mb-0 fw-bold">Income Category Registration</h1>
            </div>
            <div class="card-body p-4">
              <form id="categoryForm">
                <div class="mb-3">
                  <label for="txtCatName" class="form-label fw-semibold"
                    >Category Name</label
                  >
                  <input
                    type="text"
                    id="txtCatName"
                    class="form-control"
                    placeholder="e.g., Consulting"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="txtCatDesc" class="form-label fw- semibold"
                    >Description</label
                  >

                  <input
                    type="text"
                    id="txtCatDesc"
                    class="form-control"
                    placeholder="e.g., Enterprise technical support contract"
                    required
                  />
                </div>

                <button
                  type="button"
                  id="btnAdd"
                  class="btn btn-primary px-4 fw- semibold"
                >
                  Save Category
                </button>
              </form>
            </div>
          </div>
          <!-- Ledger Table Card -->

          <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
              <h2 class="h6 mb-0 text-secondary fw-bold text-uppercase">
                Registered Categories
              </h2>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th scope="col" class="w-35">Category Name</th>
                    <th scope="col">Description</th>
                  </tr>
                </thead>
                <tbody id="listIncomeCat">
                  <!-- Dynamic rows injected here via JavaScript -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
